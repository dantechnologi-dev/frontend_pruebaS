<!-- Linea verde superior -->
<div class="top-green-bar"></div>

<!-- Header / Barra frontal -->
<header class="navbar">
  <div class="logo">
    <img src="pcfactory.png" alt="pc Factory Logo" class="logo-img">
  </div>
</header>

<!-- Contenido Principal -->
<main class="page-container">

  <!-- Sección izquierda -->
  <div class="left-hero"></div>

  <!-- Sección derecha con el Login -->
  <div class="right-content">
    <div class="login-wrapper">
      
      <!-- Tarjeta principal -->
      <div class="login-card">
        <h1 class="login-title">Inicia sesión en pc Factory</h1>

        <form (ngSubmit)="ingresar()">
          
          <!-- Campo Usuario -->
          <div class="form-group">
            <label for="idUsuario">Usuario</label>
            <input id="idUsuario" type="text" [(ngModel)]="idUsuario" name="idUsuario" maxlength="8" placeholder="Ingrese su idusuario">
          </div>

          <!-- Campo Contraseña -->
          <div class="form-group">
            <label for="passwordUser">Contraseña</label>
            <input id="passwordUser" type="password" [(ngModel)]="passwordUser" name="passworduser" placeholder="Ingrese su contraseña">
          </div>

          <!-- Botón Inicia Sesión -->
          <button type="submit" class="btn-submit">Ingresar</button>

        </form>

      </div> <!-- 1. Cierra login-card -->
    </div>   <!-- 2. Cierra login-wrapper -->
  </div>     <!-- 3. Cierra right-content -->

</main>     <!-- Cierra page-container -->
