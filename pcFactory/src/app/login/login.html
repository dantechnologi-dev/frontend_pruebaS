<!-- Linea verde superior -->
<div class="top-green-bar"></div>

<!-- Header / Barra frontal -->
<header class="navbar">
  <div class="logo">
    <img src="pcfactory.png" alt="pc Factory Logo" class="logo-img">
  </div>
</header>

<!-- Contenido Principal -->
<main class="page-container">

  <!-- Sección izquierda con degradado opcional -->
  <div class="left-hero"></div>

  <!-- Sección derecha con el Login -->
  <div class="right-content">
    <div class="login-wrapper">
      
      <!-- Tarjeta principal -->
      <div class="login-card">
        <h1 class="login-title">Inicia sesión en pc Factory</h1>

        <form action="#" method="POST">
          <!-- Campo Correo -->
          <div class="form-group">
            <label for="email">Usuario</label>
            <input type="email" id="email" name="email" required>
          </div>

          <!-- Campo Contraseña -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
          </div>

          <!-- Botón Inicia Sesión -->
          <button type="submit" class="btn-submit">INICIA SESIÓN</button>
        </form>
      </div>

    </div>
  </div>

</main>
