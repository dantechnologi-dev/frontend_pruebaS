

<div class="producto-container">

  <div class="producto-card">

    <!-- ENCABEZADO -->
    <div class="producto-header">
      <div class="header-icon">
        <i class="bi bi-box-seam"></i>
      </div>
      <h2>Registro de Productos</h2>
    </div>

    <p class="producto-descripcion">
      Ingresa los datos del nuevo producto para registrarlo en el sistema.
    </p>

    <!-- FORMULARIO -->
    <form (ngSubmit)="guardarProducto()" #formProducto="ngForm">

      <!-- NOMBRE -->
      <div class="form-group">
        <label>Nombre del Producto <span>*</span></label>
        <input
          type="text"
          name="nombre_producto"
          [(ngModel)]="producto.nombre_producto"
          placeholder="Ej. Teclado mecánico Logitech"
          required
          maxlength="150">
      </div>

      <!-- DESCRIPCIÓN -->
      <div class="form-group">
        <label>Descripción</label>
        <textarea
          name="descripcion"
          [(ngModel)]="producto.descripcion"
          placeholder="Describe las características del producto..."
          rows="3">
        </textarea>
      </div>

      <!-- PRECIO Y STOCK -->
      <div class="form-row">

        <div class="form-group">
          <label>Precio (S/) <span>*</span></label>
          <input
            type="number"
            name="precio"
            [(ngModel)]="producto.precio"
            placeholder="Ej. 89.90"
            min="0.01"
            step="0.01"
            required>
        </div>

        <div class="form-group">
          <label>Stock <span>*</span></label>
          <input
            type="number"
            name="stock"
            [(ngModel)]="producto.stock"
            placeholder="Ej. 20"
            min="0"
            required>
        </div>

      </div>

      <!-- CATEGORÍA Y PROVEEDOR -->
      <div class="form-row">

        <div class="form-group">
          <label>Categoría <span>*</span></label>
          <select
            name="id_categoria"
            [(ngModel)]="producto.id_categoria"
            required>

            <option [ngValue]="null" disabled>
              Selecciona una categoría
            </option>

            <option
              *ngFor="let categoria of categorias"
              [ngValue]="categoria.id_categoria">
              {{ categoria.nombre_categoria }}
            </option>

          </select>
        </div>

        <div class="form-group">
          <label>Proveedor <span>*</span></label>
          <select
            name="id_proveedor"
            [(ngModel)]="producto.id_proveedor"
            required>

            <option [ngValue]="null" disabled>
              Selecciona un proveedor
            </option>

            <option
              *ngFor="let proveedor of proveedores"
              [ngValue]="proveedor.id_proveedor">
              {{ proveedor.nombre_marca }}
            </option>

          </select>
        </div>

      </div>

      <!-- IMAGEN -->
      <div class="form-group">
        <label>URL de la imagen</label>
        <input
          type="url"
          name="imagen_url"
          [(ngModel)]="producto.imagen_url"
          placeholder="https://ejemplo.com/imagen.jpg">
      </div>

      <!-- BOTONES -->
      <div class="form-buttons">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-guardar"
          [disabled]="formProducto.invalid">
          GUARDAR PRODUCTO
        </button>

      </div>

    </form>

  </div>

</div>
